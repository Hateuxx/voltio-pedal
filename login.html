<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Voltio & Pedal - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg p-4 card-custom-login">
        <h2 class="text-center fw-bold mb-4">¡¡Bienvenido a Voltio & Pedal!!</h2>
        <div class="row align-items-center">
            <!-- Columna Logo/Imagen -->
            <div class="col-md-5 text-center border-end pe-md-4 mb-3 mb-md-0">
                <div class="bg-secondary text-white d-flex align-items-center justify-content-center rounded logo-placeholder">
                    <span class="fs-4 fw-bold">LOGO<br>VOLTIO & PEDAL</span>
                </div>
            </div>
            <!-- Columna Formulario -->
            <div class="col-md-7 ps-md-4">
                <h3 class="fw-bold mb-3">Inicia Sesión</h3>
                <form>
                    <div class="mb-3">
                        <label class="form-label font-monospace">Nombre de usuario</label>
                        <input type="text" class="form-control" placeholder="Ingrese su usuario">
                    </div>
                    <div class="mb-3">
                        <label class="form-label font-monospace">Contraseña</label>
                        <input type="password" class="form-control" placeholder="**********">
                    </div>
                    <div class="mb-3 text-end">
                        <a href="#" class="text-primary text-decoration-underline small">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="button" class="btn btn-secondary btn-lg fw-bold">Ingresar</button>
                    </div>
                    <p class="text-center mb-0">¿Eres nuevo? <a href="registro.html" class="text-primary fw-bold text-decoration-underline">Regístrate</a></p>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
