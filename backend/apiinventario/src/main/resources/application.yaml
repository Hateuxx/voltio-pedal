spring:
  application:
    name: apiinventario
  datasource:
    url: jdbc:mysql://localhost:3306/voltio_pedal
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  web:
    error: 
      include-stacktrace: "never"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  admin:
    numero-documento: "70000001"
    nombres: "Administrador"
    apellidos: "Voltio & Pedal"
    password: ${ADMIN_PASSWORD:}
    pregunta-seguridad: "¿Nombre de la tienda?"
    respuesta-seguridad: ${ADMIN_RESPUESTA:}
  jwt:
    secreto: ${JWT_SECRET:}
    expiracion: 8h
  seguridad:
    intentos-maximos: 5
    bloqueo: 15m
    